name: Cleanup nested docs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm deletion of docs/docs/ tree'
        required: true
        default: 'NO'

jobs:
  cleanup:
    if: github.event.inputs.confirm == 'YES'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/risk-classifier-sprint-1
          fetch-depth: 0

      - name: Sync with latest remote
        run: |
          git fetch origin feat/risk-classifier-sprint-1
          git merge origin/feat/risk-classifier-sprint-1 --ff-only

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Remove nested docs/docs tree
        run: |
          if [ -d "docs/docs" ]; then
            echo "Removing docs/docs/ tree..."
            git rm -rf docs/docs
            git status
          else
            echo "docs/docs/ does not exist, nothing to remove"
            exit 0
          fi

      - name: Commit and push
        run: |
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: remove misplaced nested docs/docs tree"
          git push origin feat/risk-classifier-sprint-1
