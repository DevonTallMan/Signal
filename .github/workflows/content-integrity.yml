name: Content Integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: content-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assessment-ids:
    name: Assessment ID stability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest main
        run: git fetch origin main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check assessment ID stability
        env:
          BASE_REF: origin/main
        run: node scripts/check-assessment-ids.mjs

  status-lifecycle:
    name: Status lifecycle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest main
        run: git fetch origin main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check status lifecycle
        env:
          BASE_REF: origin/main
        run: node scripts/check-status-lifecycle.mjs
